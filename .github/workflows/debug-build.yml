name: Debug APK Build (VPN dev)

on:
  workflow_dispatch:
  push:
    branches: [vpn-dev]

permissions:
  contents: write

concurrency:
  group: vpn-dev-debug-build
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build debug-signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Build four APKs (debug-signed fallback)
        env:
          WEBHTV_APK_SUFFIX: "-vpn-dev"
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          # No release keystore configured -> build.gradle falls back to debug signing
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon

      - name: Collect artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-vpn-dev-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 14
