name: WebHTV APK Build & Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (默认 560)'
        required: false
        default: '560'
      version_name:
        description: 'versionName (默认 5.6.0)'
        required: false
        default: '5.6.0'
      release_tag:
        description: 'Release tag (如 v1.0.0)。留空则自动生成 v{versionName}-{时间}'
        required: false
        default: ''
      release:
        description: '是否创建 GitHub Release (true/false)'
        required: false
        default: 'false'
      release_notes:
        description: '本版本更新日志（app 检查更新弹窗 + Release 页显示，多行用 %0A 分隔）'
        required: false
        default: ''
  push:
    branches: [vpn-dev, vpn-mihomo-tun]

permissions:
  contents: write

concurrency:
  group: vpn-dev-build
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Install fixed debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp .github/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ls -la "$HOME/.android/"

      - name: Configure release signing (fixed keystore)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "no release signing secrets -> fallback to debug signature"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/.github/release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/.github/release.keystore"
          {
            echo "storeFile=$GITHUB_WORKSPACE/.github/release.keystore"
            echo "keyAlias=$KS_ALIAS"
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KS_PASS"
          } > local.properties
          echo "release signing configured: alias=$KS_ALIAS store=$GITHUB_WORKSPACE/.github/release.keystore"

      - name: Resolve version inputs
        id: version
        shell: bash
        run: |
          VER_CODE="${{ github.event.inputs.version_code || '560' }}"
          VER_NAME="${{ github.event.inputs.version_name || '5.6.0' }}"
          echo "code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VER_NAME" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        id: reltag
        shell: bash
        run: |
          RT="${{ github.event.inputs.release_tag }}"
          if [ -z "$RT" ]; then
            RT="v${{ steps.version.outputs.name }}-$(date +%Y%m%d%H%M)"
          fi
          echo "tag=$RT" >> "$GITHUB_OUTPUT"

      - name: Build four APKs (debug-signed fallback, unless release signing above)
        env:
          WEBHTV_APK_SUFFIX: ""
          WEBHTV_VERSION_CODE: ${{ steps.version.outputs.code }}
          WEBHTV_VERSION_NAME: ${{ steps.version.outputs.name }}
          WEBHTV_RELEASE_TAG: ${{ steps.reltag.outputs.tag }}
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk dist
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon
          mkdir -p dist
          cp Release/apk/*.apk dist/
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Determine release flag
        id: relflag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "do_release=${{ github.event.inputs.release || 'false' }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.reltag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.relflag.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.relflag.outputs.tag }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: |
          set -e
          if [ -z "$TAG" ]; then
            TAG="v${VERSION_NAME}-$(date +%Y%m%d%H%M)"
          fi
          echo "release tag: $TAG"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi
          export TAG
          export RELEASE_NOTES
          python3 .github/make_manifests.py
          if [ -n "$RELEASE_NOTES" ]; then
            NOTES="$RELEASE_NOTES"
            echo "--- release notes ---"
            printf '%s\n' "$NOTES"
          else
            NOTES="自动构建 Release · code ${VERSION_CODE} · tag ${TAG}"
          fi
          gh release create "$TAG" dist/*.apk dist/*.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "WebHTV ${VERSION_NAME}" \
            --notes "$NOTES"
          echo "release created: $TAG"
